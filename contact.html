<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <section class="contact-us">
    <h1>📞 Contact Us</h1>
    <p>We’d love to hear from you! Whether you have questions, feedback, or need assistance, our team is here to help.</p>

    <div class="contact-info">
        <p><strong>📍 Address:</strong> 123 Fresh Street, Ramachandrapuram, TG</p>
        <p><strong>📧 Email:</strong> support@cleanwave.com</p>
        <p><strong>📱 Phone:</strong> +91 98765 43210</p>
    </div>

    <form class="contact-form">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>

    
</body>
</html>
